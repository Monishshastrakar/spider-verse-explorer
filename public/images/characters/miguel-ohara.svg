<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Miguel O'Hara Spider-Man 2099 in dark blue suit with red skull insignia and arm talons">
  <defs>
    <radialGradient id="mo-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d50000" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0a1930" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="mo-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15284f"/>
      <stop offset="50%" stop-color="#0a152e"/>
      <stop offset="100%" stop-color="#050a17"/>
    </linearGradient>
    <filter id="mo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#mo-bg)"/>

  <!-- Futuristic Cyber Grid -->
  <g stroke="#00e5ff" stroke-width="1" opacity="0.15">
    <path d="M40 100 L360 100 M40 200 L360 200 M40 300 L360 300"/>
    <path d="M100 40 L100 360 M200 40 L200 360 M300 40 L300 360"/>
    <!-- Concentric Hexagons (Nueva York Portal) -->
    <polygon points="200,80 280,130 280,230 200,280 120,230 120,130" fill="none" stroke="#d50000" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Massive Shoulders & Torso -->
  <path d="M60 380 C80 270, 140 240, 200 240 C260 240, 320 270, 340 380 Z" fill="url(#mo-suit)" stroke="#000" stroke-width="4"/>

  <!-- Red Hard-Light Arm Spikes / Talons -->
  <g fill="#d50000" filter="url(#mo-glow)">
    <polygon points="68,340 35,320 72,310"/>
    <polygon points="75,295 42,275 80,270"/>
    <polygon points="332,340 365,320 328,310"/>
    <polygon points="325,295 358,275 320,270"/>
  </g>

  <!-- Giant Crimson Skull Chest Emblem (2099 Design) -->
  <g fill="#d50000" stroke="#ff1744" stroke-width="1.5" filter="url(#mo-glow)">
    <!-- Central Skull Forehead -->
    <polygon points="200,265 180,285 190,310 200,305 210,310 220,285"/>
    <!-- Fanged Skull Teeth Extending Downward -->
    <polygon points="185,312 188,345 194,320 200,350 206,320 212,345 215,312"/>
    <!-- Upper Skull Horns / Spider Legs Spanning across chest -->
    <path d="M180 280 L130 260 L95 285 L140 280 L175 295" stroke="#d50000" stroke-width="4" fill="#d50000"/>
    <path d="M220 280 L270 260 L305 285 L260 280 L225 295" stroke="#d50000" stroke-width="4" fill="#d50000"/>
  </g>

  <!-- Neck / Trapezoids -->
  <path d="M165 210 L165 255 L235 255 L235 210 Z" fill="#0d1b38"/>

  <!-- Head Base (Aggressive Chiselled Mask) -->
  <polygon points="200,75 260,110 268,180 245,235 200,250 155,235 132,180 140,110" fill="url(#mo-suit)" stroke="#000000" stroke-width="5"/>

  <!-- Skull Facial Markings on Mask (Fierce Red Cyber Markings) -->
  <g fill="#d50000" stroke="#ff1744" stroke-width="1.5" filter="url(#mo-glow)">
    <!-- Center Nose / Brow Crest -->
    <polygon points="200,120 193,145 200,155 207,145"/>
    <!-- Jaw Fangs on Mask -->
    <path d="M160 190 L145 220 L165 215 Z"/>
    <path d="M240 190 L255 220 L235 215 Z"/>
  </g>

  <!-- Aggressive Glowing Red Visor Eyes -->
  <g filter="url(#mo-glow)">
    <!-- Left Visor -->
    <polygon points="152,145 188,136 182,154 165,158 152,152" fill="#ff1744" stroke="#ffffff" stroke-width="2"/>
    <!-- Right Visor -->
    <polygon points="248,145 212,136 218,154 235,158 248,152" fill="#ff1744" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Hard-Light Collar Highlights -->
  <path d="M150 250 L200 270 L250 250" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>

  <!-- Comic Outer Frame -->
  <rect x="8" y="8" width="384" height="384" rx="20" fill="none" stroke="#d50000" stroke-width="2" opacity="0.4"/>
  <rect x="4" y="4" width="392" height="392" rx="22" fill="none" stroke="#000000" stroke-width="3"/>
</svg>
