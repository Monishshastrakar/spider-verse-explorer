<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Miguel O'Hara Spider-Man 2099 with crimson skull insignia, glowing cybernetic visor, and hard-light talons">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="mo-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d50000" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#140a24" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#070c18" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#03060d" stop-opacity="1"/>
    </radialGradient>

    <!-- Deep Midnight Suit Gradient -->
    <linearGradient id="mo-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2e59"/>
      <stop offset="45%" stop-color="#0f1b38"/>
      <stop offset="80%" stop-color="#080e21"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>

    <linearGradient id="mo-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#9b0000"/>
    </linearGradient>

    <filter id="mo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Halftone Cyber Pattern -->
    <pattern id="mo-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.5" fill="#00e5ff" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="500" height="500" rx="28" fill="url(#mo-bg)"/>
  <rect width="500" height="500" rx="28" fill="url(#mo-dots)"/>

  <!-- Futuristic Hexagonal Portal Geometry (Nueva York Horizon) -->
  <g stroke="#d50000" stroke-width="1.5" opacity="0.3" fill="none">
    <polygon points="250,50 380,125 380,275 250,350 120,275 120,125"/>
    <polygon points="250,85 350,145 350,255 250,315 150,255 150,145" stroke="#00e5ff" stroke-width="1"/>
    <line x1="120" y1="125" x2="380" y2="275"/>
    <line x1="380" y1="125" x2="120" y2="275"/>
  </g>

  <!-- Powerful Trapezius and Massive Shoulders -->
  <g>
    <!-- Suit Body Base -->
    <path d="M50 490 C75 340, 150 290, 250 290 C350 290, 425 340, 450 490 Z" fill="url(#mo-suit)" stroke="#000000" stroke-width="6"/>

    <!-- Hard-Light Crimson Forearm Fins & Shoulder Talons -->
    <g fill="url(#mo-red)" filter="url(#mo-glow)">
      <!-- Left Shoulder Fins -->
      <polygon points="65,420 20,390 70,380"/>
      <polygon points="80,360 30,330 85,320"/>
      <polygon points="100,305 55,275 105,270"/>

      <!-- Right Shoulder Fins -->
      <polygon points="435,420 480,390 430,380"/>
      <polygon points="420,360 470,330 415,320"/>
      <polygon points="400,305 445,275 395,270"/>
    </g>

    <!-- Giant Iconic 2099 Crimson Skull Chest Emblem -->
    <g fill="url(#mo-red)" stroke="#ff1744" stroke-width="2" filter="url(#mo-glow)">
      <!-- Central Forehead of Skull -->
      <polygon points="250,325 220,350 235,385 250,380 265,385 280,350"/>
      <!-- Fanged Skull Teeth extending down into chest -->
      <polygon points="228,390 232,435 240,405 250,445 260,405 268,435 272,390"/>
      <!-- Broad Spider-Leg Horns across chest -->
      <path d="M225,345 L150,315 L100,345 L160,340 L218,365 Z"/>
      <path d="M275,345 L350,315 L400,345 L340,340 L282,365 Z"/>
      <!-- Lower Spanning Ribs -->
      <path d="M220,385 L145,395 L110,430 L165,415 L220,405 Z"/>
      <path d="M280,385 L355,395 L390,430 L335,415 L280,405 Z"/>
    </g>

    <!-- Thick Muscular Neck -->
    <path d="M205,240 L205,305 L295,305 L295,240 Z" fill="#0c1730" stroke="#000" stroke-width="4"/>
  </g>

  <!-- MASK & HEAD (Aggressive Angular Jawline & Brow) -->
  <g>
    <!-- Head Base Silhouette -->
    <polygon points="250,80 325,125 335,210 305,275 250,295 195,275 165,210 175,125" fill="url(#mo-suit)" stroke="#050a14" stroke-width="7"/>

    <!-- Subtle Specular Hard-Light Edge along Jaw -->
    <polygon points="250,85 320,128 328,205 300,268 250,288 200,268 172,205 180,128" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.4"/>

    <!-- Skull Mask Facial Markings (Fierce Red Tribal / Cyber Markings) -->
    <g fill="url(#mo-red)" stroke="#ff1744" stroke-width="2" filter="url(#mo-glow)">
      <!-- Center Brow Blade -->
      <polygon points="250,130 240,165 250,180 260,165"/>
      <!-- Left Cheek Fangs -->
      <polygon points="205,215 180,255 210,248"/>
      <!-- Right Cheek Fangs -->
      <polygon points="295,215 320,255 290,248"/>
      <!-- Chin Crest -->
      <polygon points="250,265 240,285 250,290 260,285"/>
    </g>

    <!-- INTENSE GLOWING RED CYBER-VISOR SLIT EYES -->
    <g filter="url(#mo-glow)">
      <!-- Left Visor Eye -->
      <polygon points="195,168 238,155 230,178 208,184 195,176" fill="#ff1744" stroke="#ffffff" stroke-width="3"/>
      <polygon points="200,169 233,158 226,174 210,179 200,173" fill="#ffffff" opacity="0.9"/>

      <!-- Right Visor Eye -->
      <polygon points="305,168 262,155 270,178 292,184 305,176" fill="#ff1744" stroke="#ffffff" stroke-width="3"/>
      <polygon points="300,169 267,158 274,174 290,179 300,173" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Hard-Light Arm Spike Projections & Digital Aura -->
    <path d="M190,290 L250,315 L310,290" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Outer Comic Stamped Frame -->
  <rect x="10" y="10" width="480" height="480" rx="22" fill="none" stroke="#d50000" stroke-width="3" opacity="0.45"/>
  <rect x="5" y="5" width="490" height="490" rx="25" fill="none" stroke="#000000" stroke-width="4"/>
</svg>
