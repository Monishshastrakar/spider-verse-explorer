<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hobie Brown Spider-Punk in spiked mask and denim vest with anarchy patches">
  <defs>
    <radialGradient id="hb-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffe600" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d50000" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#141416" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="hb-vest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="70%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#1b2428"/>
    </linearGradient>
    <filter id="hb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#hb-bg)"/>

  <!-- Chaotic Punk Zine Halftone / Xerox Streaks -->
  <g stroke="#ffe600" stroke-width="2" opacity="0.3" stroke-linecap="round">
    <line x1="30" y1="50" x2="80" y2="40"/>
    <line x1="40" y1="65" x2="100" y2="55"/>
    <line x1="320" y1="70" x2="370" y2="90"/>
    <line x1="310" y1="85" x2="360" y2="105"/>
    <path d="M50 320 L70 300 L90 330" fill="none"/>
    <path d="M330 310 L350 330 L370 300" fill="none"/>
  </g>

  <!-- Cut-Off Denim Battle Vest & Shoulders -->
  <path d="M80 380 C100 290, 150 260, 200 260 C250 260, 300 290, 320 380 Z" fill="url(#hb-vest)" stroke="#000" stroke-width="4"/>
  <!-- Torn Vest Collar & Lapels -->
  <path d="M150 265 L170 320 L200 340 L230 320 L250 265" fill="#1b2428" stroke="#000" stroke-width="3"/>
  <!-- Safety Pins & Button Badges on Denim Vest -->
  <g>
    <!-- Anarchy Badge -->
    <circle cx="130" cy="330" r="14" fill="#000" stroke="#d50000" stroke-width="2.5"/>
    <text x="130" y="335" font-family="monospace" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Punk Button -->
    <circle cx="270" cy="330" r="14" fill="#ffe600" stroke="#000" stroke-width="2"/>
    <text x="270" y="334" font-family="monospace" font-size="8" font-weight="900" fill="#000000" text-anchor="middle">PUNK</text>
    <!-- Silver Safety Pins -->
    <rect x="155" y="340" width="22" height="6" rx="3" fill="#cfd8dc" stroke="#000" stroke-width="1.5" transform="rotate(-30 155 340)"/>
    <rect x="235" y="340" width="22" height="6" rx="3" fill="#cfd8dc" stroke="#000" stroke-width="1.5" transform="rotate(30 235 340)"/>
  </g>

  <!-- Red Mask Head Base -->
  <ellipse cx="200" cy="180" rx="72" ry="92" fill="#d50000" stroke="#000" stroke-width="5"/>

  <!-- Screen-Printed Punk Webbing on Mask (Raw, Hand-Drawn Vibe) -->
  <g stroke="#000000" stroke-width="3" opacity="0.75" fill="none" stroke-linecap="round">
    <path d="M200 90 L200 265"/>
    <path d="M198 165 L135 140 M202 165 L265 140"/>
    <path d="M198 195 L140 215 M202 195 L260 215"/>
    <path d="M198 225 L155 245 M202 225 L245 245"/>
    <path d="M165 130 L175 145 M235 130 L225 145"/>
    <path d="M150 180 L165 195 M250 180 L235 195"/>
  </g>

  <!-- Iconic Spiked Mohawk Along Crown of Mask -->
  <g fill="#cfd8dc" stroke="#000000" stroke-width="2.5">
    <polygon points="200,35 188,75 212,75"/>
    <polygon points="200,65 186,105 214,105"/>
    <polygon points="200,98 187,130 213,130"/>
    <polygon points="200,125 188,150 212,150"/>
    <!-- Yellow Lighting Highlights on Spikes -->
    <line x1="200" y1="40" x2="200" y2="70" stroke="#ffe600" stroke-width="3"/>
    <line x1="200" y1="72" x2="200" y2="100" stroke="#ffe600" stroke-width="3"/>
  </g>

  <!-- Asymmetric Jagged Punk Lenses with Black & Yellow Rims -->
  <g filter="url(#hb-glow)">
    <!-- Left Jagged Lens -->
    <polygon points="140,150 170,132 186,155 160,180 142,165" fill="#ffffff" stroke="#000000" stroke-width="6"/>
    <line x1="145" y1="145" x2="182" y2="160" stroke="#ffe600" stroke-width="3"/>

    <!-- Right Jagged Lens -->
    <polygon points="260,150 230,132 214,155 240,180 258,165" fill="#ffffff" stroke="#000000" stroke-width="6"/>
    <line x1="255" y1="145" x2="218" y2="160" stroke="#00e5ff" stroke-width="3"/>
  </g>

  <!-- Comic Outer Frame with Punk Offset Style -->
  <rect x="8" y="8" width="384" height="384" rx="20" fill="none" stroke="#ffe600" stroke-width="3" opacity="0.6"/>
  <rect x="4" y="4" width="392" height="392" rx="22" fill="none" stroke="#000000" stroke-width="3"/>
</svg>
