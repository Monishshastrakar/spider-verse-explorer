<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Miles Morales in black and red Spider-Man suit with bio-electric venom blast">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="mm-vortex" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ff1361" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#1a0b18" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#0a0a12" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040407" stop-opacity="1"/>
    </radialGradient>

    <!-- Suit Fabric Gradients -->
    <linearGradient id="mm-black-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a38"/>
      <stop offset="35%" stop-color="#14141d"/>
      <stop offset="70%" stop-color="#09090f"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>

    <linearGradient id="mm-spray-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#9b0000"/>
    </linearGradient>

    <!-- Glowing Eye Filter -->
    <filter id="mm-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Comic Halftone Pattern -->
    <pattern id="mm-halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#ff1361" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="500" height="500" rx="28" fill="url(#mm-vortex)"/>
  <rect width="500" height="500" rx="28" fill="url(#mm-halftone)"/>

  <!-- Comic Action Speed Rays -->
  <g stroke="#ff1361" stroke-width="1.2" opacity="0.25">
    <line x1="250" y1="40" x2="250" y2="460"/>
    <line x1="40" y1="250" x2="460" y2="250"/>
    <line x1="80" y1="80" x2="420" y2="420"/>
    <line x1="80" y1="420" x2="420" y2="80"/>
    <circle cx="250" cy="250" r="160" fill="none" stroke-dasharray="8 8"/>
    <circle cx="250" cy="250" r="210" fill="none" opacity="0.4"/>
  </g>

  <!-- Dramatic Rim Light Aura Behind Mask -->
  <ellipse cx="250" cy="220" rx="130" ry="155" fill="#ff1361" opacity="0.22" filter="url(#mm-neon-glow)"/>

  <!-- Torso & Shoulders -->
  <g>
    <!-- Suit Body Base -->
    <path d="M100 480 C125 360, 180 320, 250 320 C320 320, 375 360, 400 480 Z" fill="url(#mm-black-suit)" stroke="#000000" stroke-width="6"/>
    <!-- Red Shoulder Accent Stripes (Miles Across the Spider-Verse Suit) -->
    <path d="M125 450 C145 375, 185 345, 215 340 L210 375 C185 380, 155 405, 140 460 Z" fill="url(#mm-spray-red)"/>
    <path d="M375 450 C355 375, 315 345, 285 340 L290 375 C315 380, 345 405, 360 460 Z" fill="url(#mm-spray-red)"/>

    <!-- Iconic Spray-Painted Red Spider Chest Insignia -->
    <g fill="url(#mm-spray-red)" stroke="#ff1744" stroke-width="1.5" filter="url(#mm-neon-glow)">
      <!-- Spider Abdomen -->
      <path d="M250 380 C240 380, 235 410, 245 430 C248 436, 252 436, 255 430 C265 410, 260 380, 250 380 Z"/>
      <!-- Spider Head -->
      <circle cx="250" cy="370" r="8"/>
      <!-- Spray Paint Splatter Legs -->
      <path d="M244 374 L210 350 L185 370 M244 384 L200 384 L175 400 M244 394 L205 408 L185 435 M244 402 L215 428 L200 460" fill="none" stroke="#d50000" stroke-width="5" stroke-linecap="round"/>
      <path d="M256 374 L290 350 L315 370 M256 384 L300 384 L325 400 M256 394 L295 408 L315 435 M256 402 L285 428 L300 460" fill="none" stroke="#d50000" stroke-width="5" stroke-linecap="round"/>
      <!-- Stencil Spray Drips -->
      <circle cx="200" cy="470" r="3" fill="#ff1744"/>
      <circle cx="300" cy="470" r="3" fill="#ff1744"/>
      <circle cx="250" cy="445" r="2.5" fill="#ff1744"/>
    </g>

    <!-- Collar / Neck Base -->
    <path d="M215 280 L215 330 L285 330 L285 280 Z" fill="#14141d" stroke="#000" stroke-width="4"/>
  </g>

  <!-- MASK & HEAD -->
  <g>
    <!-- Head Silhouette with Comic Anatomy -->
    <path d="M250 85 C325 85, 355 145, 350 220 C345 285, 305 325, 250 330 C195 325, 155 285, 150 220 C145 145, 175 85, 250 85 Z" fill="url(#mm-black-suit)" stroke="#07070b" stroke-width="7"/>

    <!-- Subtle Mask Fabric Specular Shading -->
    <path d="M190 100 C230 90, 270 90, 310 100 C330 140, 335 180, 335 220 C295 200, 205 200, 165 220 C165 180, 170 140, 190 100 Z" fill="#ffffff" opacity="0.06"/>

    <!-- Red Webbing on Mask (Stylized Spider-Verse Red Webbing) -->
    <g stroke="#e52521" stroke-width="3" opacity="0.75" fill="none" stroke-linecap="round">
      <!-- Center Forehead Ridge -->
      <path d="M250 88 L250 326"/>
      <!-- Upper Web Radiations -->
      <path d="M250 180 Q200 170 162 150"/>
      <path d="M250 180 Q300 170 338 150"/>
      <!-- Cheeks & Jaw Web Radiations -->
      <path d="M250 220 Q195 225 168 250"/>
      <path d="M250 220 Q305 225 332 250"/>
      <path d="M250 260 Q205 275 185 300"/>
      <path d="M250 260 Q295 275 315 300"/>
      <!-- Concentric Web Arcs -->
      <path d="M205 130 Q250 115 295 130"/>
      <path d="M185 160 Q250 142 315 160"/>
    </g>

    <!-- SIGNATURE MILES MORALES EYE LENSES -->
    <g filter="url(#mm-neon-glow)">
      <!-- Left Eye Outer Red Rim -->
      <path d="M178 185 C176 150, 210 145, 235 168 C230 205, 212 232, 185 228 C178 218, 176 200, 178 185 Z" fill="#ffffff" stroke="#e52521" stroke-width="8" stroke-linejoin="round"/>
      <!-- Left Eye Inner Cyan Chromatic Accent -->
      <path d="M190 192 L225 178" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <!-- Left Eye Shading Tone -->
      <path d="M182 195 Q200 220 222 210" stroke="#cfd8dc" stroke-width="2.5" fill="none" opacity="0.6"/>

      <!-- Right Eye Outer Red Rim -->
      <path d="M322 185 C324 150, 290 145, 265 168 C270 205, 288 232, 315 228 C322 218, 324 200, 322 185 Z" fill="#ffffff" stroke="#e52521" stroke-width="8" stroke-linejoin="round"/>
      <!-- Right Eye Inner Cyan Chromatic Accent -->
      <path d="M310 192 L275 178" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <!-- Right Eye Shading Tone -->
      <path d="M318 195 Q300 220 278 210" stroke="#cfd8dc" stroke-width="2.5" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- BIO-ELECTRIC VENOM BLAST CRACKLES (Electric Yellow & Cyan Energy) -->
  <g filter="url(#mm-neon-glow)">
    <!-- Left Venom Sparks -->
    <path d="M135 160 L155 178 L142 190 L165 210" fill="none" stroke="#ffe600" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 185 L138 200 L130 215" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="138" cy="155" r="3.5" fill="#ffe600"/>

    <!-- Right Venom Sparks -->
    <path d="M365 160 L345 178 L358 190 L335 210" fill="none" stroke="#ffe600" stroke-width="4" stroke-linecap="round"/>
    <path d="M380 185 L362 200 L370 215" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="362" cy="155" r="3.5" fill="#ffe600"/>

    <!-- Shoulder Venom Arcs -->
    <path d="M170 330 L185 345 L175 360 L195 375" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round"/>
    <path d="M330 330 L315 345 L325 360 L305 375" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Outer Comic Stamped Frame -->
  <rect x="10" y="10" width="480" height="480" rx="22" fill="none" stroke="#ff1361" stroke-width="3" opacity="0.4"/>
  <rect x="5" y="5" width="490" height="490" rx="25" fill="none" stroke="#000000" stroke-width="4"/>
</svg>
