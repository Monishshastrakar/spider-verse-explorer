<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gwen Stacy in white hooded Spider-Gwen suit with neon magenta and teal web lining">
  <defs>
    <radialGradient id="gs-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ff4081" stop-opacity="0.15"/>
      <stop offset="85%" stop-color="#10101c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06060c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gs-hood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <filter id="gs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect width="400" height="400" rx="24" fill="url(#gs-bg)"/>

  <!-- Subtle Watercolor / Drum Rhythm Soundwaves -->
  <g stroke="#00e5ff" stroke-width="1.5" opacity="0.25" fill="none">
    <circle cx="200" cy="180" r="140" stroke-dasharray="8 6"/>
    <circle cx="200" cy="180" r="180" opacity="0.15"/>
    <path d="M60 180 Q100 120 140 180 T220 180 T300 180 T340 180" stroke="#ff4081" opacity="0.3"/>
  </g>

  <!-- Aerodynamic Shoulders (Black with Teal Accents) -->
  <path d="M100 380 C120 300, 160 270, 200 270 C240 270, 280 300, 300 380 Z" fill="#101018" stroke="#000" stroke-width="4"/>
  <path d="M105 350 C125 315, 155 305, 175 305 L175 380" stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M295 350 C275 315, 245 305, 225 305 L225 380" stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Inside Hood Webbing (Magenta & Teal geometric pattern) -->
  <g fill="none">
    <path d="M120 180 C115 100, 150 65, 200 60 C250 65, 285 100, 280 180 C275 240, 250 275, 200 275 C150 275, 125 240, 120 180 Z" fill="#ff4081" opacity="0.15"/>
    <!-- Hood Interior Web Rays -->
    <path d="M200 70 L135 150 M200 70 L265 150 M200 70 L130 200 M200 70 L270 200" stroke="#ff4081" stroke-width="1.8" opacity="0.5"/>
    <path d="M145 130 Q200 95 255 130" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
    <path d="M135 170 Q200 130 265 170" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
    <path d="M138 210 Q200 170 262 210" stroke="#ff4081" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Mask Base (Pure White) -->
  <ellipse cx="200" cy="180" rx="64" ry="80" fill="#ffffff" stroke="#12121a" stroke-width="4"/>
  <!-- Subtle Chin Contour -->
  <path d="M170 240 Q200 255 230 240" stroke="#cfd8dc" stroke-width="2" fill="none"/>

  <!-- Sleek Spider-Gwen Mask Eye Lenses (Sharp, Elongated, Pink Rim with Teal Reflection) -->
  <g filter="url(#gs-glow)">
    <!-- Left Eye Lens -->
    <path d="M148 162 C152 142, 172 138, 188 152 C184 174, 168 186, 152 182 C148 176, 146 168, 148 162 Z" fill="#000000" stroke="#ff4081" stroke-width="5"/>
    <path d="M154 158 Q174 146 182 154" stroke="#00e5ff" stroke-width="3" fill="none"/>

    <!-- Right Eye Lens -->
    <path d="M252 162 C248 142, 228 138, 212 152 C216 174, 232 186, 248 182 C252 176, 254 168, 252 162 Z" fill="#000000" stroke="#ff4081" stroke-width="5"/>
    <path d="M246 158 Q226 146 218 154" stroke="#00e5ff" stroke-width="3" fill="none"/>
  </g>

  <!-- The Iconic White Hood Outer Shell (Draped Over Head and Shoulders) -->
  <path d="M100 190 C95 90, 140 40, 200 38 C260 40, 305 90, 300 190 C300 260, 275 305, 260 315 C245 325, 225 305, 200 305 C175 305, 155 325, 140 315 C125 305, 100 260, 100 190 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <path d="M100 190 C95 90, 140 40, 200 38 C260 40, 305 90, 300 190 C300 260, 275 305, 260 315 C245 325, 225 305, 200 305 C175 305, 155 325, 140 315 C125 305, 100 260, 100 190 Z" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Hood Drape Highlight Line -->
  <path d="M115 185 C110 110, 150 55, 200 52 C250 55, 290 110, 285 185" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Comic Outer Frame -->
  <rect x="8" y="8" width="384" height="384" rx="20" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.4"/>
  <rect x="4" y="4" width="392" height="392" rx="22" fill="none" stroke="#000000" stroke-width="3"/>
</svg>
