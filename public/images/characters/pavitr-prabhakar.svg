<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pavitr Prabhakar Spider-Man India with stylish hair, ornate gold filigree, and red mask">
  <defs>
    <radialGradient id="ppr-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d32f2f" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#14141c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#08080f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ppr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="60%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="ppr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#ppr-bg)"/>

  <!-- Ornate Mandala Web Grid -->
  <g stroke="#ffb300" stroke-width="1" opacity="0.2" fill="none">
    <circle cx="200" cy="190" r="140"/>
    <circle cx="200" cy="190" r="90"/>
    <path d="M200 50 L200 330 M60 190 L340 190"/>
    <polygon points="200,80 280,190 200,300 120,190"/>
    <polygon points="200,100 260,190 200,280 140,190"/>
  </g>

  <!-- Dhoti Collar & Shoulders (Crimson & Teal/Navy) -->
  <path d="M85 380 C105 300, 150 265, 200 265 C250 265, 295 300, 315 380 Z" fill="#14223d" stroke="#000" stroke-width="4"/>
  <!-- Gold Embroidered Collar V-Neck -->
  <path d="M160 265 L200 320 L240 265" fill="#c62828" stroke="#ffb300" stroke-width="4"/>
  <circle cx="200" cy="328" r="5" fill="#ffb300"/>

  <!-- Red Mask Head Base -->
  <ellipse cx="200" cy="185" rx="72" ry="90" fill="#d32f2f" stroke="#000" stroke-width="5"/>

  <!-- Traditional Filigree Web Patterns on Face -->
  <g stroke="#ffb300" stroke-width="2" opacity="0.8" fill="none">
    <!-- Forehead Bindi / Mandala Crest -->
    <circle cx="200" cy="125" r="4" fill="#ffb300"/>
    <path d="M190 125 Q200 110 210 125"/>
    <path d="M180 125 Q200 100 220 125"/>
    <!-- Cheek Curves -->
    <path d="M150 215 Q175 235 200 230 Q225 235 250 215"/>
    <path d="M165 240 Q200 255 235 240"/>
  </g>

  <!-- Flowing Stylized Black Hair (Iconic Pavitr Prabhakar Haircut) -->
  <g fill="#1a1a24" stroke="#000000" stroke-width="3">
    <!-- Top Hair Crest with Volume and Curls -->
    <path d="M140 110 C130 65, 160 40, 200 38 C235 38, 265 60, 270 95 C255 75, 230 68, 205 72 C180 75, 160 90, 140 110 Z"/>
    <!-- Left Hair Tuft -->
    <path d="M142 90 C125 75, 110 85, 115 110 C120 125, 138 125, 145 115 Z"/>
    <!-- Right Hair Tuft -->
    <path d="M260 85 C275 75, 290 85, 285 110 C280 125, 262 125, 255 115 Z"/>
    <!-- Blue Hair Reflection Highlights -->
    <path d="M170 58 Q200 48 230 54" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Expressive White Eye Lenses with Gold Filigree Arches -->
  <g filter="url(#ppr-glow)">
    <!-- Left Eye -->
    <path d="M142 165 C145 145, 168 140, 186 156 C182 178, 166 190, 148 185 C144 180, 142 172, 142 165 Z" fill="#ffffff" stroke="#ffb300" stroke-width="5"/>
    <path d="M138 158 Q165 140 190 152" fill="none" stroke="#ffd54f" stroke-width="2.5"/>

    <!-- Right Eye -->
    <path d="M258 165 C255 145, 232 140, 214 156 C218 178, 234 190, 252 185 C256 180, 258 172, 258 165 Z" fill="#ffffff" stroke="#ffb300" stroke-width="5"/>
    <path d="M262 158 Q235 140 210 152" fill="none" stroke="#ffd54f" stroke-width="2.5"/>
  </g>

  <!-- Gold Bangle Web Ring Accents on Shoulders -->
  <circle cx="115" cy="340" r="18" fill="none" stroke="#ffb300" stroke-width="3"/>
  <circle cx="285" cy="340" r="18" fill="none" stroke="#ffb300" stroke-width="3"/>

  <!-- Comic Outer Frame -->
  <rect x="8" y="8" width="384" height="384" rx="20" fill="none" stroke="#ffb300" stroke-width="2" opacity="0.4"/>
  <rect x="4" y="4" width="392" height="392" rx="22" fill="none" stroke="#000000" stroke-width="3"/>
</svg>
