<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peni Parker anime pilot with SP//dr biomechanical spider-mech">
  <defs>
    <radialGradient id="ppk-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c62828" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#141420" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#08080f" stop-opacity="1"/>
    </radialGradient>
    <filter id="ppk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#ppk-bg)"/>

  <!-- Manga Speed Lines & Cyber Net -->
  <g stroke="#00e5ff" stroke-width="1" opacity="0.2" stroke-linecap="round">
    <line x1="20" y1="40" x2="100" y2="80"/>
    <line x1="380" y1="40" x2="300" y2="80"/>
    <line x1="20" y1="360" x2="100" y2="320"/>
    <line x1="380" y1="360" x2="300" y2="320"/>
    <!-- Cyber Tokyo-39 Circuit Circles -->
    <circle cx="200" cy="160" r="130" fill="none" stroke="#ff1744" stroke-dasharray="6 8"/>
  </g>

  <!-- BACKGROUND: SP//dr Mech Spherical Chassis -->
  <g>
    <!-- Mech Dome Head -->
    <ellipse cx="200" cy="140" rx="130" ry="110" fill="#c62828" stroke="#111118" stroke-width="5"/>
    <!-- Titanium White Cheek Insets -->
    <path d="M78 140 C80 180, 115 220, 150 230 L135 150 Z" fill="#eceff1" stroke="#000" stroke-width="3"/>
    <path d="M322 140 C320 180, 285 220, 250 230 L265 150 Z" fill="#eceff1" stroke="#000" stroke-width="3"/>
    <!-- Center Mech Antenna -->
    <path d="M200 30 L200 60" stroke="#000" stroke-width="4"/>
    <circle cx="200" cy="26" r="6" fill="#00e5ff" filter="url(#ppk-glow)"/>

    <!-- SP//dr Giant Digital Eye Visors (Cyan LED Matrix) -->
    <g filter="url(#ppk-glow)">
      <!-- Left Mech Visor -->
      <ellipse cx="140" cy="118" rx="24" ry="20" fill="#000000" stroke="#00e5ff" stroke-width="4"/>
      <ellipse cx="140" cy="118" rx="14" ry="10" fill="#00e5ff"/>
      <line x1="128" y1="112" x2="152" y2="112" stroke="#ffffff" stroke-width="2"/>
      <line x1="128" y1="124" x2="152" y2="124" stroke="#ffffff" stroke-width="2"/>

      <!-- Right Mech Visor -->
      <ellipse cx="260" cy="118" rx="24" ry="20" fill="#000000" stroke="#00e5ff" stroke-width="4"/>
      <ellipse cx="260" cy="118" rx="14" ry="10" fill="#00e5ff"/>
      <line x1="248" y1="112" x2="272" y2="112" stroke="#ffffff" stroke-width="2"/>
      <line x1="248" y1="124" x2="272" y2="124" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- FOREGROUND: Peni Parker (Anime Pilot Hero) -->
  <g>
    <!-- School Uniform Shoulders & Red Tie -->
    <path d="M125 380 C135 310, 165 290, 200 290 C235 290, 265 310, 275 380 Z" fill="#263238" stroke="#000" stroke-width="4"/>
    <!-- White Shirt Collar -->
    <polygon points="175,290 200,325 185,325" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <polygon points="225,290 200,325 215,325" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <!-- Red School Tie -->
    <polygon points="195,320 205,320 210,360 200,375 190,360" fill="#d50000" stroke="#000" stroke-width="2"/>

    <!-- Peni Face & Neck -->
    <path d="M188 275 L188 295 L212 295 L212 275 Z" fill="#ffe0b2"/>
    <!-- Cute Anime Face Shape -->
    <path d="M165 215 C165 195, 175 190, 200 190 C225 190, 235 195, 235 215 C235 245, 215 272, 200 275 C185 272, 165 245, 165 215 Z" fill="#ffecb3" stroke="#000" stroke-width="3"/>

    <!-- Anime Eyes (Large, Expressive, Sparkly) -->
    <!-- Left Eye -->
    <ellipse cx="182" cy="225" rx="8" ry="11" fill="#1a237e"/>
    <circle cx="180" cy="222" r="3.5" fill="#ffffff"/>
    <circle cx="184" cy="230" r="1.5" fill="#ffffff"/>
    <path d="M172 215 Q182 210 190 215" stroke="#000" stroke-width="2.5" fill="none"/>
    <!-- Blush -->
    <ellipse cx="174" cy="238" rx="4" ry="2" fill="#ff8a80" opacity="0.6"/>

    <!-- Right Eye -->
    <ellipse cx="218" cy="225" rx="8" ry="11" fill="#1a237e"/>
    <circle cx="216" cy="222" r="3.5" fill="#ffffff"/>
    <circle cx="220" cy="230" r="1.5" fill="#ffffff"/>
    <path d="M210 215 Q218 210 228 215" stroke="#000" stroke-width="2.5" fill="none"/>
    <!-- Blush -->
    <ellipse cx="226" cy="238" rx="4" ry="2" fill="#ff8a80" opacity="0.6"/>

    <!-- Smile -->
    <path d="M195 248 Q200 252 205 248" stroke="#d50000" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Peni Hair (Dark Bob Cut with Bangs & Red Hairclip) -->
    <g fill="#212121" stroke="#000" stroke-width="2">
      <!-- Back hair -->
      <path d="M160 210 C155 170, 175 165, 200 165 C225 165, 245 170, 240 210 C245 240, 235 255, 235 255 C235 255, 240 210, 230 205 C210 195, 190 195, 170 205 C160 210, 165 255, 165 255 C165 255, 155 240, 160 210 Z"/>
      <!-- Bangs -->
      <path d="M165 190 Q180 208 185 198 Q195 210 205 198 Q220 208 235 190 Z"/>
      <!-- Red Hairclip on Side -->
      <rect x="162" y="185" width="8" height="4" rx="2" fill="#ff1744" stroke="#000" stroke-width="1.5" transform="rotate(-25 162 185)"/>
    </g>
  </g>

  <!-- Comic Outer Frame -->
  <rect x="8" y="8" width="384" height="384" rx="20" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.4"/>
  <rect x="4" y="4" width="392" height="392" rx="22" fill="none" stroke="#000000" stroke-width="3"/>
</svg>
